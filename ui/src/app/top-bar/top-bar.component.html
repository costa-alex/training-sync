<mat-toolbar class="top-bar">

  @if (isMobile$ | async) {

    <button
      mat-icon-button
      aria-label="Open menu"
      (click)="menuClicked.emit()">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="mobile-page-title">
      {{ currentPageTitle }}
    </span>

  } @else {

    <a
      class="brand-link"
      routerLink="/home"
      aria-label="TrainingSync home">
      <span class="brand-mark">
        <mat-icon>sync</mat-icon>
      </span>
      <span class="brand-copy">
        <strong>TrainingSync</strong>
        <small>WORKOUT WORKSPACE</small>
      </span>
    </a>

    <nav class="desktop-menu" aria-label="Main navigation">
      @for (button of menuButtons; track button.url) {
        <a
          mat-button
          class="desktop-menu-link"
          [class.active-page-button]="isActive(button.url)"
          [attr.aria-current]="isActive(button.url) ? 'page' : null"
          [routerLink]="[button.url]">
          <mat-icon>{{ button.icon }}</mat-icon>
          <span>
            {{ button.name }}
          </span>
        </a>
      }
    </nav>

  }

  <span class="spacer"></span>

</mat-toolbar>
